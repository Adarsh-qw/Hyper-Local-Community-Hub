<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hyper-Local Community Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e3340;--teal:#14627a;--blue:#226e91;--green:#3f7f43;--bg:#f3f8f8;--line:#cfe0e3;--red:#b3261e;--amber:#8a5a00}
*{box-sizing:border-box}
body{margin:0;font:1rem/1.55 "Atkinson Hyperlegible",system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
a,button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid #f5b700;outline-offset:2px}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:#fff;padding:8px 12px;z-index:50;border-radius:6px}
.skip:focus{top:8px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:10px clamp(12px,4vw,40px);background:#fff;border-bottom:1px solid var(--line)}
.logo{height:clamp(56px,9vw,84px);width:auto;display:block}
.ctl{display:flex;gap:12px;flex-wrap:wrap}
.ctl label{display:grid;gap:2px;font-size:.8rem;font-weight:700}
select,input,textarea{border:2px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);min-height:44px;max-width:100%}
.band{background:var(--teal);color:#fff;padding:18px clamp(12px,4vw,40px)}
.band h2{margin:0;font-size:1.1rem}
.band p{margin:2px 0 12px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.nums a{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:#fff;color:var(--ink);text-decoration:none;border-radius:16px 16px 16px 4px;padding:10px 16px;font-weight:700}
.nums b{font-size:clamp(1.6rem,5vw,2.3rem);color:var(--teal);letter-spacing:.02em}
main{display:grid;gap:20px;padding:20px clamp(12px,4vw,40px) 100px;grid-template-areas:"map" "alerts" "board"}
@media(min-width:900px){main{grid-template-columns:1.6fr 1fr;grid-template-areas:"map alerts" "board board"}}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
#mapsec{grid-area:map}#alerts{grid-area:alerts}#board{grid-area:board}
h2{margin:0 0 10px;font-size:1.25rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:10px 16px;min-height:44px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--ink)}
.btn.alt{background:#fff;color:var(--teal);border:2px solid var(--teal)}
#map{height:min(55vh,420px);margin-top:12px;border-radius:8px;background:#e3eef0;display:grid;place-items:center;text-align:center;padding:12px}
#map p{margin:0 0 8px}
#map .btn{display:inline-block;text-decoration:none;margin:4px}
.l{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.l li{border:1px solid var(--line);border-inline-start:6px solid var(--teal);border-radius:6px;padding:8px 12px}
.l li.hospital,.l li.high,.l li.need{border-inline-start-color:var(--red)}
.l li.relief,.l li.offer{border-inline-start-color:var(--green)}
.l li.warn{border-inline-start-color:var(--amber)}
.l li.done{opacity:.6}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:1px 9px;border-radius:99px;color:#fff;background:var(--teal)}
.tag.high,.tag.hospital{background:var(--red)}.tag.warn{background:var(--amber)}
.tag.relief,.tag.offer{background:var(--green)}.tag.need{background:var(--blue)}
.meta{font-size:.85rem;opacity:.8}
#feed{max-height:420px;overflow:auto}
.live{font-size:.78rem;font-weight:700;background:#fde8e6;color:var(--red);border-radius:99px;padding:2px 10px}
.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-inline-end:6px;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
form.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:end}
form.row .wide{grid-column:1/-1}
textarea{width:100%;resize:vertical}
#chatBtn{position:fixed;inset-block-end:16px;inset-inline-end:16px;z-index:20;border-radius:99px;box-shadow:0 4px 14px #0004}
#chat{position:fixed;inset-block-end:76px;inset-inline-end:12px;z-index:20;width:min(360px,calc(100vw - 24px));height:min(440px,70vh);background:#fff;border:2px solid var(--teal);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
#chat[hidden]{display:none}
#log{flex:1;overflow:auto;padding:10px;display:grid;align-content:start;gap:8px}
.m{max-width:85%;padding:8px 12px;border-radius:12px;background:#e6f1f3}
.m.u{justify-self:end;background:var(--teal);color:#fff}
#cf{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
#cf input{flex:1;min-width:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

      <select id="lng"><option value="en">English</option><option value="es">Español</option><option value="hi">हिन्दी</option><option value="ar">العربية</option></select>
    </label>
  </div>
</header>

<section class="band" aria-labelledby="hl">
  <h2 id="hl" data-i18n="helplines">Emergency helplines</h2>
  <p><span data-i18n="danger">In danger? Call now.</span> <span id="where"></span></p>
  <div class="nums">
    <a id="a0" href="#"><span data-i18n="police">Police</span><b></b></a>
    <a id="a1" href="#"><span data-i18n="ambulance">Ambulance</span><b></b></a>
    <a id="a2" href="#"><span data-i18n="fire">Fire</span><b></b></a>
  </div>
</section>

<main id="main">
  <section id="mapsec" class="card" aria-labelledby="mh">
    <h2 id="mh" data-i18n="map">Nearby services</h2>
    <button class="btn" id="loc" data-i18n="locate">Find services near me</button>
    <p id="st" role="status" class="meta"></p>
    <div id="map" role="region" aria-label="Map"></div>
    <ul class="l" id="places"></ul>
  </section>

  <section id="alerts" class="card" aria-labelledby="ah">
    <h2 id="ah"><span data-i18n="alerts">Emergency alerts</span> <span class="live" data-i18n="live">Live</span></h2>
    <p class="meta" id="demo" data-i18n="demo"></p>
    <ul class="l" id="feed" tabindex="0" aria-live="polite"></ul>
  </section>

  <section id="board" class="card" aria-labelledby="bh">
    <h2 id="bh" data-i18n="board">Volunteer board</h2>
    <form class="row" id="pf">
      <label><span data-i18n="name">Your name</span><input id="pn" required maxlength="40" autocomplete="name"></label>
      <label><span>&nbsp;</span>
        <select id="pt"><option value="offer" data-i18n="offer">I can help</option><option value="need" data-i18n="need">I need help</option></select>
      </label>
      <label class="wide"><span data-i18n="msg">What can you offer or need?</span><textarea id="pm" required maxlength="280" rows="3"></textarea></label>
      <button class="btn" data-i18n="post">Post</button>
    </form>
    <ul class="l" id="posts"></ul>
  </section>
</main>

<button class="btn" id="chatBtn" aria-expanded="false" aria-controls="chat" data-i18n="chat">Assistant</button>
<section id="chat" hidden aria-label="Assistant">
  <div id="log" role="log" aria-live="polite"></div>
  <form id="cf"><input id="ci" aria-label="Message" data-ph="ph" autocomplete="off"><button class="btn" data-i18n="send">Send</button></form>
</section>

<script>
/* ---------- CONFIG ---------- */
const GMAPS_KEY = 'YOUR_GOOGLE_MAPS_API_KEY'; // Maps JavaScript API + Places API (New)
const ALERT_FEED_URL = '';                    // optional JSON: [{"lv":"high|warn|info","msg":"...","ts":"ISO date"}]
const IP_API = 'https://ipapi.co/json/';      // swap for any service returning country_code

/* ---------- HELPERS ---------- */
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const el = (tag, cls, txt) => {const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e;};

/* ---------- i18n ---------- */
const L = {
en:{skip:'Skip to content',danger:'In danger? Call now.',helplines:'Emergency helplines',police:'Police',ambulance:'Ambulance',fire:'Fire',country:'Country',auto:'detected from your connection',other:'Other (112)',map:'Nearby services',locate:'Find services near me',locating:'Finding your location…',denied:'Location unavailable. Allow location access and try again.',you:'You are here',hospital:'Hospital',relief:'Relief center',none:'Nothing found nearby.',dir:'Directions',alerts:'Emergency alerts',live:'Live',demo:'Sample data. Connect a feed in ALERT_FEED_URL.',lvH:'Urgent',lvW:'Warning',lvI:'Info',board:'Volunteer board',name:'Your name',offer:'I can help',need:'I need help',msg:'What can you offer or need?',post:'Post',resolve:'Mark resolved',reopen:'Reopen',chat:'Assistant',ph:'Ask for help…',send:'Send',hello:'Hi! I can share emergency numbers, first-aid basics and point you to services. What do you need?',nomap:'Add your Google Maps API key to show the live map. Meanwhile, open these searches:',mH:'Hospitals near me',mR:'Relief centers near me'},
es:{skip:'Saltar al contenido',danger:'¿En peligro? Llama ahora.',helplines:'Líneas de emergencia',police:'Policía',ambulance:'Ambulancia',fire:'Bomberos',country:'País',auto:'detectado por tu conexión',other:'Otro (112)',map:'Servicios cercanos',locate:'Buscar servicios cerca de mí',locating:'Buscando tu ubicación…',denied:'Ubicación no disponible. Permite el acceso e inténtalo de nuevo.',you:'Estás aquí',hospital:'Hospital',relief:'Centro de ayuda',none:'No se encontró nada cerca.',dir:'Cómo llegar',alerts:'Alertas de emergencia',live:'En vivo',demo:'Datos de ejemplo. Conecta una fuente en ALERT_FEED_URL.',lvH:'Urgente',lvW:'Aviso',lvI:'Info',board:'Tablero de voluntarios',name:'Tu nombre',offer:'Puedo ayudar',need:'Necesito ayuda',msg:'¿Qué puedes ofrecer o necesitas?',post:'Publicar',resolve:'Marcar resuelto',reopen:'Reabrir',chat:'Asistente',ph:'Pide ayuda…',send:'Enviar',hello:'¡Hola! Puedo darte números de emergencia, primeros auxilios básicos y servicios cercanos. ¿Qué necesitas?',nomap:'Añade tu clave de Google Maps para ver el mapa. Mientras tanto, abre estas búsquedas:',mH:'Hospitales cerca de mí',mR:'Centros de ayuda cerca de mí'},
hi:{skip:'मुख्य सामग्री पर जाएँ',danger:'खतरे में हैं? अभी कॉल करें।',helplines:'आपातकालीन हेल्पलाइन',police:'पुलिस',ambulance:'एम्बुलेंस',fire:'दमकल',country:'देश',auto:'आपके कनेक्शन से पहचाना गया',other:'अन्य (112)',map:'आस-पास की सेवाएँ',locate:'मेरे पास की सेवाएँ खोजें',locating:'आपका स्थान खोजा जा रहा है…',denied:'स्थान उपलब्ध नहीं। अनुमति दें और फिर कोशिश करें।',you:'आप यहाँ हैं',hospital:'अस्पताल',relief:'राहत केंद्र',none:'आस-पास कुछ नहीं मिला।',dir:'रास्ता देखें',alerts:'आपातकालीन अलर्ट',live:'लाइव',demo:'नमूना डेटा। ALERT_FEED_URL में फ़ीड जोड़ें।',lvH:'अत्यावश्यक',lvW:'चेतावनी',lvI:'सूचना',board:'स्वयंसेवक बोर्ड',name:'आपका नाम',offer:'मैं मदद कर सकता/सकती हूँ',need:'मुझे मदद चाहिए',msg:'आप क्या दे सकते हैं या आपको क्या चाहिए?',post:'पोस्ट करें',resolve:'हल हुआ चिह्नित करें',reopen:'फिर खोलें',chat:'सहायक',ph:'मदद माँगें…',send:'भेजें',hello:'नमस्ते! मैं आपातकालीन नंबर, प्राथमिक उपचार की जानकारी और आस-पास की सेवाएँ बता सकता हूँ। आपको क्या चाहिए?',nomap:'लाइव मैप के लिए अपनी Google Maps कुंजी जोड़ें। तब तक ये खोजें खोलें:',mH:'मेरे पास के अस्पताल',mR:'मेरे पास के राहत केंद्र'},
ar:{skip:'انتقل إلى المحتوى',danger:'في خطر؟ اتصل الآن.',helplines:'خطوط الطوارئ',police:'الشرطة',ambulance:'الإسعاف',fire:'الإطفاء',country:'الدولة',auto:'تم اكتشافها من اتصالك',other:'أخرى (112)',map:'الخدمات القريبة',locate:'ابحث عن خدمات قريبة مني',locating:'جارٍ تحديد موقعك…',denied:'الموقع غير متاح. اسمح بالوصول إلى الموقع وحاول مجددًا.',you:'أنت هنا',hospital:'مستشفى',relief:'مركز إغاثة',none:'لم يتم العثور على شيء قريب.',dir:'الاتجاهات',alerts:'تنبيهات الطوارئ',live:'مباشر',demo:'بيانات تجريبية. اربط مصدرًا في ALERT_FEED_URL.',lvH:'عاجل',lvW:'تحذير',lvI:'معلومة',board:'لوحة المتطوعين',name:'اسمك',offer:'يمكنني المساعدة',need:'أحتاج مساعدة',msg:'ماذا يمكنك أن تقدم أو تحتاج؟',post:'نشر',resolve:'تحديد كمحلول',reopen:'إعادة فتح',chat:'المساعد',ph:'اطلب المساعدة…',send:'إرسال',hello:'مرحبًا! يمكنني تزويدك بأرقام الطوارئ وأساسيات الإسعاف الأولي والخدمات القريبة. ماذا تحتاج؟',nomap:'أضف مفتاح Google Maps لعرض الخريطة المباشرة. في الأثناء افتح هذه البحوث:',mH:'مستشفيات قريبة مني',mR:'مراكز إغاثة قريبة مني'}
};
let lang = store.get('lang') || (L[navigator.language.slice(0,2)] ? navigator.language.slice(0,2) : 'en');
const t = k => (L[lang] && L[lang][k]) || L.en[k] || k;

/* ---------- COUNTRY HELPLINES: [police, ambulance, fire] ---------- */
const H = {US:[911,911,911],CA:[911,911,911],MX:[911,911,911],GB:[999,999,999],IE:[999,999,999],IN:[100,102,101],AU:['000','000','000'],NZ:[111,111,111],DE:[110,112,112],FR:[17,15,18],ES:[112,112,112],IT:[113,118,115],BR:[190,192,193],JP:[110,119,119],CN:[110,120,119],PK:[15,1122,16],BD:[999,999,999],NG:[112,112,112],ZA:[10111,10177,112],KE:[999,999,999],PH:[911,911,911],ID:[110,118,113],EG:[122,123,180],SA:[999,997,998],AE:[999,998,997],XX:[112,112,112]};
let cc = 'XX', detected = false;
const cname = () => cc === 'XX' ? t('other') : (new Intl.DisplayNames([lang], {type:'region'}).of(cc));

function fillCountries(){
  const s = $('#cty'); s.textContent = '';
  Object.keys(H).filter(c => c !== 'XX').map(c => [c, new Intl.DisplayNames([lang], {type:'region'}).of(c)])
    .sort((a,b) => a[1].localeCompare(b[1], lang)).concat([['XX', t('other')]])
    .forEach(([c,n]) => { const o = el('option', '', n); o.value = c; s.append(o); });
  s.value = cc;
}
function setCountry(c, auto){
  cc = H[c] ? c : 'XX'; detected = !!auto && cc !== 'XX';
  H[cc].forEach((n,i) => { const a = $('#a'+i); a.href = 'tel:' + n; a.querySelector('b').textContent = n; });
  $('#cty').value = cc;
  $('#where').textContent = '· ' + cname() + (detected ? ' (' + t('auto') + ')' : '');
}
async function detectCountry(){
  let c = null;
  try { const ctl = new AbortController(); setTimeout(() => ctl.abort(), 4000);
    c = (await (await fetch(IP_API, {signal: ctl.signal})).json()).country_code; } catch {}
  if (c) return setCountry(c, true);
  const r = (navigator.language.split('-')[1] || '').toUpperCase();
  setCountry(r);
}

/* ---------- LANGUAGE SWITCHER ---------- */
function setLang(l){
  lang = l; store.set('lang', l);
  document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  $$('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
  $$('[data-ph]').forEach(e => e.placeholder = t(e.dataset.ph));
  $('#lng').value = l; fillCountries(); setCountry(cc, detected); renderAlerts(); renderPosts();
  if (!window.google && !pos) mapIdle();
}

/* ---------- MAP + NEARBY SERVICES ---------- */
let map, pos, markers = [];
const status = m => $('#st').textContent = m;
function mapIdle(){ $('#map').textContent = ''; $('#map').append(el('p', '', t('locate'))); }
function loadMaps(){ return new Promise((ok, fail) => {
  if (window.google && google.maps) return ok();
  window.gmReady = ok;
  const s = document.createElement('script');
  s.src = `https://maps.googleapis.com/maps/api/js?key=${GMAPS_KEY}&loading=async&v=weekly&callback=gmReady`;
  s.onerror = fail; document.head.append(s);
}); }
function locate(){
  status(t('locating'));
  if (!navigator.geolocation) return status(t('denied'));
  navigator.geolocation.getCurrentPosition(p => { pos = {lat:p.coords.latitude, lng:p.coords.longitude}; status(''); showServices(); },
    () => status(t('denied')), {enableHighAccuracy:true, timeout:10000});
}
function addRow(kind, name, addr, lat, lng){
  const li = el('li', kind);
  li.append(el('span', 'tag ' + kind, t(kind)), ' ', el('strong', '', name));
  if (addr) li.append(el('div', 'meta', addr));
  const a = el('a', '', t('dir')); a.href = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`; a.target = '_blank'; a.rel = 'noopener';
  li.append(a); $('#places').append(li);
}
async function showServices(){
  $('#places').textContent = '';
  if (GMAPS_KEY.startsWith('YOUR')) {            // no key: still useful, deep-link to Google Maps
    const box = $('#map'); box.textContent = ''; box.append(el('p', '', t('nomap')));
    [['mH','hospitals'],['mR','disaster relief center']].forEach(([k,q]) => {
      const a = el('a', 'btn', t(k)); a.href = `https://www.google.com/maps/search/${encodeURIComponent(q)}/@${pos.lat},${pos.lng},14z`; a.target = '_blank'; a.rel = 'noopener'; box.append(a); });
    return;
  }
  try {
    await loadMaps();
    const {Map} = await google.maps.importLibrary('maps'), {Place} = await google.maps.importLibrary('places');
    $('#map').textContent = '';
    map = map || new Map($('#map'), {center:pos, zoom:14, mapTypeControl:false});
    map.setCenter(pos); markers.forEach(m => m.setMap(null)); markers = [];
    const pin = (p, title, c) => markers.push(new google.maps.Marker({map, position:p, title,
      icon:{path:google.maps.SymbolPath.CIRCLE, scale:9, fillColor:c, fillOpacity:1, strokeColor:'#fff', strokeWeight:2}}));
    pin(pos, t('you'), '#226e91');
    const f = ['displayName','location','formattedAddress'];
    const [h, r] = await Promise.all([
      Place.searchNearby({fields:f, locationRestriction:{center:pos, radius:6000}, includedPrimaryTypes:['hospital'], maxResultCount:10}),
      Place.searchByText({textQuery:'disaster relief center emergency shelter', fields:f, locationBias:{center:pos, radius:8000}, maxResultCount:10})]);
    [[h.places,'hospital','#b3261e'],[r.places,'relief','#3f7f43']].forEach(([list,kind,c]) => list.forEach(p => {
      pin(p.location, p.displayName, c); addRow(kind, p.displayName, p.formattedAddress, p.location.lat(), p.location.lng()); }));
    if (!$('#places').children.length) $('#places').append(el('li', '', t('none')));
  } catch (e) { status('Map error: ' + (e.message || e)); }
}

/* ---------- LIVE ALERT FEED ---------- */
const DEMO = [['high','Flash flood warning for low-lying areas until 18:00.'],['info','Relief center open at the community school, 9:00–20:00.'],['warn','Boil-water advisory in effect for the north district.'],['info','Blood donation drive at the central clinic today.'],['warn','Road closure on Main Street due to fallen trees.']];
let alerts = DEMO.slice(0,3).map(([lv,msg],i) => ({lv, msg, ts:new Date(Date.now() - i*600000)})), n = 3;
const LV = {high:'lvH', warn:'lvW', info:'lvI'};
function renderAlerts(){
  const ul = $('#feed'); ul.textContent = '';
  alerts.forEach(a => { const li = el('li', a.lv);
    li.append(el('span', 'tag ' + a.lv, t(LV[a.lv] || 'lvI')), ' ', el('span', 'meta', new Intl.DateTimeFormat(lang, {timeStyle:'short'}).format(new Date(a.ts))), el('div', '', a.msg));
    ul.append(li); });
  $('#demo').hidden = !!ALERT_FEED_URL;
}
async function pollAlerts(){
  if (ALERT_FEED_URL) { try { alerts = await (await fetch(ALERT_FEED_URL)).json(); renderAlerts(); } catch {} }
  else { const [lv,msg] = DEMO[n++ % DEMO.length]; alerts = [{lv, msg, ts:new Date()}, ...alerts].slice(0,8); renderAlerts(); }
}

/* ---------- VOLUNTEER BOARD ---------- */
let posts = store.get('posts') || [
  {type:'need', name:'Maria', msg:'Need a volunteer driver to bring groceries to an elderly neighbor on Elm Street.', ts:Date.now()-7200000, done:false},
  {type:'offer', name:'Sam', msg:'Have a pickup truck and free Saturday morning to help move supplies.', ts:Date.now()-3600000, done:false}];
function renderPosts(){
  const ul = $('#posts'); ul.textContent = '';
  posts.forEach((p, i) => { const li = el('li', p.type + (p.done ? ' done' : ''));
    li.append(el('span', 'tag ' + p.type, t(p.type)), ' ', el('strong', '', p.name), ' ',
      el('span', 'meta', new Intl.DateTimeFormat(lang, {dateStyle:'medium', timeStyle:'short'}).format(new Date(p.ts))), el('p', '', p.msg));
    const b = el('button', 'btn alt', t(p.done ? 'reopen' : 'resolve'));
    b.onclick = () => { p.done = !p.done; store.set('posts', posts); renderPosts(); };
    li.append(b); ul.append(li); });
}
$('#pf').onsubmit = e => {
  e.preventDefault();
  posts.unshift({type:$('#pt').value, name:$('#pn').value.trim(), msg:$('#pm').value.trim(), ts:Date.now(), done:false});
  posts = posts.slice(0, 50); store.set('posts', posts); e.target.reset(); renderPosts();
};

/* ---------- LIGHTWEIGHT CHATBOT (rule-based, runs offline) ---------- */
const nums = () => { const h = H[cc]; return `${cname()}: police ${h[0]}, ambulance ${h[1]}, fire ${h[2]}.`; };
const KB = [
  [/ambulance|police|emergency|helpline|hotline|number|911|112|999/i, () => 'Emergency numbers for ' + nums() + ' If life is in danger, call now.'],
  [/cpr|not breathing|unconscious|heart attack/i, () => 'Call ' + H[cc][1] + ' first. Then push hard and fast in the center of the chest, about 100–120 times a minute, until help arrives.'],
  [/bleed|cut|wound/i, () => 'Press firmly on the wound with a clean cloth and keep pressing. Raise the limb if you can. Call ' + H[cc][1] + ' if bleeding does not stop.'],
  [/hospital|clinic|doctor|medical/i, () => 'Tap “' + t('locate') + '” on the map to see nearby hospitals with directions.'],
  [/shelter|relief|food|water|evacuat/i, () => 'Tap “' + t('locate') + '” to find relief centers near you, and check the alert feed for openings.'],
  [/flood/i, () => 'Move to higher ground. Never walk or drive through floodwater. Follow the alert feed.'],
  [/earthquake|quake/i, () => 'Drop, cover and hold on. Stay away from windows. When shaking stops, move outside carefully if it is safe.'],
  [/fire|smoke/i, () => 'Get out, stay low under smoke and do not use elevators. Call ' + H[cc][2] + ' from a safe place.'],
  [/volunteer|donate|help out|offer/i, () => 'Post what you can offer or need on the Volunteer board. Neighbors can see it right away.'],
  [/^(hi|hello|hey)\b/i, () => t('hello')]
];
const say = (txt, me) => { const m = el('div', 'm' + (me ? ' u' : ''), txt); $('#log').append(m); m.scrollIntoView({block:'end'}); };
$('#chatBtn').onclick = () => {
  const c = $('#chat'), open = c.hidden; c.hidden = !open; $('#chatBtn').setAttribute('aria-expanded', open);
  if (open) { if (!$('#log').children.length) say(t('hello')); $('#ci').focus(); }
};
$('#cf').onsubmit = e => {
  e.preventDefault(); const q = $('#ci').value.trim(); if (!q) return;
  say(q, true); $('#ci').value = '';
  const hit = KB.find(([re]) => re.test(q));
  setTimeout(() => say(hit ? hit[1]() : 'I’m not sure about that. For emergencies call ' + H[cc][1] + '. Try asking about emergency numbers, first aid, shelters or volunteering.'), 350);
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#chat').hidden) $('#chatBtn').click(); });

/* ---------- INIT ---------- */
$('#loc').onclick = locate;
$('#lng').onchange = e => setLang(e.target.value);
$('#cty').onchange = e => setCountry(e.target.value, false);
setLang(lang); mapIdle(); detectCountry(); renderAlerts();
setInterval(pollAlerts, ALERT_FEED_URL ? 60000 : 30000);
</script>
</body>
</html>
